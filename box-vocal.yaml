i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO40   # WS
    i2s_bclk_pin: GPIO41    # SCK
  - id: i2s_out
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO15

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO42     # SD
    adc_type: external
    pdm: false
    channel: left
    
speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO17
    dac_type: external
    channel: mono

